# Blueprint do Render — sobe banco + backend + frontend.
# Como usar: Render > New + > Blueprint > conecte este repo > Apply.
#
# Ajuste as URLs caso os subdominios dos servicos sejam alterados.

databases:
  - name: smartbudget-db
    databaseName: app_financeiro
    user: smartbudget
    plan: free

services:
  # Backend: Spring Boot (Java 21) via Docker
  - type: web
    name: smartbudget-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: app-financeiro-back-end
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: DB_HOST
        fromDatabase:
          name: smartbudget-db
          property: host

      - key: DB_PORT
        fromDatabase:
          name: smartbudget-db
          property: port

      - key: DB_NAME
        fromDatabase:
          name: smartbudget-db
          property: database

      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: smartbudget-db
          property: user

      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: smartbudget-db
          property: password

      - key: JWT_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: https://smartbudget-web-atkh.onrender.com

      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0

  # Frontend: React + Vite
  - type: web
    name: smartbudget-web
    runtime: static
    rootDir: app-financeiro-front-end
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://smartbudget-api-4rtr.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html