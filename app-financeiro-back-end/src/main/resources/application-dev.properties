# Somente para desenvolvimento local. Nunca utilizar no deploy.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/app_financeiro}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DEV_DB_PASSWORD:smartbudget-local-only}}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt.secret=${JWT_SECRET:smartbudget-development-only-not-a-production-signing-key}