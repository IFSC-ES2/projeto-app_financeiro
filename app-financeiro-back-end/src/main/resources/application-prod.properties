# Render injeta DB_HOST, DB_PORT e DB_NAME; Compose injeta a URL JDBC.
# Valores ausentes sao rejeitados por ConfiguracaoProducao antes dos beans.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

jwt.secret=${JWT_SECRET:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Evita adotar silenciosamente um banco nao versionado em producao.
spring.flyway.baseline-on-migrate=false